name: Import approved setup visual test
on:
  push:
    paths:
      - '.github/workflows/import-step1-test.yml'
permissions:
  contents: write
jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[asset-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full-resolution Canva source
        env:
          URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2Fab17e1b7-2c3a-4744-9f58-975db16ebab1/watermark:F/width:1122?csig=AAAAAAAAAAAAAAAAAAAAAJNeJnt0h6bNXTQWL5WyTRywN17Uw4X17D32je62G1dy&exp=1787257501&osig=AAAAAAAAAAAAAAAAAAAAALYe5i8SwoX2orHClnK6eZniRN0Da3tl7OAcSrJnUUjh&signer=media-rpc&x-canva-quality=thumbnail'
        run: |
          mkdir -p assets/setup/v2
          curl -L --fail --retry 2 "$URL" -o assets/setup/v2/step-01-microsd.png
          python3 - <<'PY'
          import struct
          p='assets/setup/v2/step-01-microsd.png'
          b=open(p,'rb').read(24)
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('not png')
          w,h=struct.unpack('>II',b[16:24])
          print('downloaded',w,h)
          if w < 1000 or h < 1200: raise SystemExit(f'bad dimensions {w}x{h}')
          PY
      - name: Commit imported asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/setup/v2/step-01-microsd.png
          git commit -m 'assets: import approved setup Step 1 [asset-import]'
          git push
