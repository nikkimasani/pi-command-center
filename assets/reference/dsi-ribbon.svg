<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="DSI ribbon connection safety"><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#eff6ff;font-weight:800}.p{fill:#b6c7da}.ok{fill:#86efac}.bad{fill:#fca5a5}</style><rect width="1000" height="520" rx="28" fill="#08111a"/><text x="45" y="60" class="h" font-size="30">DSI ribbon checklist</text><g transform="translate(60 120)"><rect width="390" height="260" rx="20" fill="#152334" stroke="#40546c"/><text x="195" y="40" text-anchor="middle" class="ok" font-size="24">Correct</text><rect x="95" y="95" width="200" height="48" rx="7" fill="#d7dde6"/><rect x="150" y="140" width="90" height="105" fill="#e8e1c7"/><rect x="158" y="140" width="74" height="20" fill="#bf9b3f"/><text x="195" y="185" text-anchor="middle" fill="#111" font-size="14">contacts aligned</text><text x="195" y="225" text-anchor="middle" class="p" font-size="16">ribbon straight • latch closed</text></g><g transform="translate(550 120)"><rect width="390" height="260" rx="20" fill="#152334" stroke="#40546c"/><text x="195" y="40" text-anchor="middle" class="bad" font-size="24">Stop</text><rect x="95" y="95" width="200" height="48" rx="7" fill="#d7dde6"/><path d="M150 143 L245 245" stroke="#e8e1c7" stroke-width="55"/><path d="M165 150 L233 223" stroke="#bf9b3f" stroke-width="10"/><text x="195" y="225" text-anchor="middle" class="p" font-size="16">crooked • creased • forced</text></g><text x="45" y="455" class="p" font-size="19">Power the Pi completely off before opening either MIPI/DSI latch. Match the contact orientation to your exact display and cable.</text></svg>