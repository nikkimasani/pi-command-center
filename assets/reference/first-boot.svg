<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#07101a"/><rect x="30" y="30" width="1140" height="615" rx="28" fill="#0d1824" stroke="#31445c" stroke-width="3"/><text x="70" y="92" fill="#9ee66b" font-family="Arial" font-size="28" font-weight="700">Raspberry Pi OS • First boot checklist</text><rect x="80" y="140" width="720" height="410" rx="24" fill="#172636" stroke="#526981" stroke-width="3"/><rect x="115" y="180" width="650" height="330" rx="18" fill="#4b7593"/><rect x="115" y="180" width="650" height="44" rx="18" fill="#d8e1e8"/><circle cx="143" cy="202" r="8" fill="#d94d62"/><circle cx="168" cy="202" r="8" fill="#e0b447"/><circle cx="193" cy="202" r="8" fill="#5cbf77"/><text x="440" y="363" text-anchor="middle" fill="white" font-family="Arial" font-size="48" font-weight="700">Raspberry Pi OS Desktop</text><g font-family="Arial"><rect x="850" y="150" width="275" height="72" rx="16" fill="#102638"/><text x="885" y="194" fill="#f8fafc" font-size="22" font-weight="700">✓ Pointer + keyboard</text><rect x="850" y="242" width="275" height="72" rx="16" fill="#102638"/><text x="885" y="286" fill="#f8fafc" font-size="22" font-weight="700">✓ Wi-Fi connected</text><rect x="850" y="334" width="275" height="72" rx="16" fill="#102638"/><text x="885" y="378" fill="#f8fafc" font-size="22" font-weight="700">✓ Chromium opens</text><rect x="850" y="426" width="275" height="72" rx="16" fill="#102638"/><text x="885" y="470" fill="#f8fafc" font-size="22" font-weight="700">✓ No reboot loop</text><text x="75" y="610" fill="#d9e4ef" font-size="20">Connect display and input first. Connect USB-C power last. Stop here if the Pi is unstable or reports undervoltage.</text></g></svg>