<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#07101a"/><rect x="30" y="30" width="1140" height="615" rx="28" fill="#0d1824" stroke="#31445c" stroke-width="3"/><text x="70" y="92" fill="#9ee66b" font-family="Arial" font-size="28" font-weight="700">Raspberry Pi 5 • Final health and cold-boot gate</text><rect x="85" y="145" width="670" height="365" rx="22" fill="#05090e" stroke="#526981" stroke-width="3"/><g fill="#7ce3b2" font-family="monospace" font-size="22"><text x="120" y="220">$ hostname -I</text><text x="120" y="275">$ vcgencmd measure_temp</text><text x="120" y="330">$ df -h /</text><text x="120" y="385">$ ssh username@pi-command.local</text><text x="120" y="440">$ sudo shutdown -h now</text></g><g font-family="Arial"><circle cx="930" cy="260" r="112" fill="#123326" stroke="#4ade80" stroke-width="8"/><path d="M865 262l44 44 88-108" fill="none" stroke="#4ade80" stroke-width="22" stroke-linecap="round"/><text x="930" y="430" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">Power off 10 seconds</text><text x="930" y="470" text-anchor="middle" fill="#aebdce" font-size="20">then cold boot again</text><text x="75" y="575" fill="#f8fafc" font-size="22" font-weight="700">Ready only when:</text><text x="75" y="610" fill="#d9e4ef" font-size="19">IP, temperature, storage and SSH checks work, then a true cold boot returns to Raspberry Pi OS Desktop.</text></g></svg>