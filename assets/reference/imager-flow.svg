<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-label="Raspberry Pi Imager workflow"><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f8fafc;font-weight:800}.s{fill:#a9bad0}.n{fill:#0f172a;stroke:#4b6380;stroke-width:3}</style><rect width="1100" height="500" rx="28" fill="#08111a"/><text x="45" y="58" class="h" font-size="30">Raspberry Pi Imager • safe workflow</text><g transform="translate(45 115)"><rect class="n" width="190" height="190" rx="18"/><text x="95" y="55" text-anchor="middle" class="h" font-size="18">1. Device</text><text x="95" y="95" text-anchor="middle" class="s" font-size="16">Choose</text><text x="95" y="120" text-anchor="middle" class="h" font-size="24">Raspberry Pi 5</text></g><g transform="translate(260 115)"><rect class="n" width="190" height="190" rx="18"/><text x="95" y="55" text-anchor="middle" class="h" font-size="18">2. OS</text><text x="95" y="95" text-anchor="middle" class="s" font-size="16">Choose current</text><text x="95" y="120" text-anchor="middle" class="h" font-size="22">64-bit Desktop</text></g><g transform="translate(475 115)"><rect class="n" width="190" height="190" rx="18"/><text x="95" y="55" text-anchor="middle" class="h" font-size="18">3. Storage</text><text x="95" y="95" text-anchor="middle" class="s" font-size="16">Select only your</text><text x="95" y="120" text-anchor="middle" class="h" font-size="22">microSD card</text></g><g transform="translate(690 115)"><rect class="n" width="190" height="190" rx="18"/><text x="95" y="55" text-anchor="middle" class="h" font-size="18">4. Customize</text><text x="95" y="90" text-anchor="middle" class="s" font-size="15">username • Wi-Fi</text><text x="95" y="116" text-anchor="middle" class="s" font-size="15">hostname • locale</text><text x="95" y="142" text-anchor="middle" class="h" font-size="20">enable SSH</text></g><g transform="translate(905 115)"><rect class="n" width="150" height="190" rx="18"/><text x="75" y="55" text-anchor="middle" class="h" font-size="18">5. Write</text><text x="75" y="95" text-anchor="middle" class="s" font-size="16">write</text><text x="75" y="122" text-anchor="middle" class="h" font-size="22">verify</text><text x="75" y="150" text-anchor="middle" class="s" font-size="16">eject</text></g><text x="45" y="390" class="h" font-size="21">Then: insert microSD while Pi is off → connect display/keyboard → connect USB-C power last → finish first boot → update.</text><text x="45" y="430" class="s" font-size="18">Current Imager wording can change. Follow the same choices even if button placement moves.</text></svg>