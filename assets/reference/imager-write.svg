<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#07101a"/><rect x="30" y="30" width="1140" height="615" rx="28" fill="#0d1824" stroke="#31445c" stroke-width="3"/><text x="70" y="92" fill="#9ee66b" font-family="Arial" font-size="28" font-weight="700">Raspberry Pi Imager • Write, verify, eject</text><g font-family="Arial"><rect x="80" y="160" width="250" height="270" rx="24" fill="#121f2d" stroke="#51657c" stroke-width="3"/><text x="205" y="215" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">1. Write</text><rect x="130" y="255" width="150" height="70" rx="14" fill="#d92e53"/><text x="205" y="299" text-anchor="middle" fill="white" font-size="24" font-weight="700">WRITE</text><text x="205" y="365" text-anchor="middle" fill="#9fb0c5" font-size="17">Confirm the target card</text><rect x="475" y="160" width="250" height="270" rx="24" fill="#121f2d" stroke="#51657c" stroke-width="3"/><text x="600" y="215" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">2. Verify</text><circle cx="600" cy="292" r="55" fill="#123326" stroke="#4ade80" stroke-width="5"/><path d="M570 292l20 20 40-50" fill="none" stroke="#4ade80" stroke-width="12" stroke-linecap="round"/><text x="600" y="380" text-anchor="middle" fill="#9fb0c5" font-size="17">Wait for verification</text><rect x="870" y="160" width="250" height="270" rx="24" fill="#121f2d" stroke="#51657c" stroke-width="3"/><text x="995" y="215" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">3. Eject</text><rect x="945" y="255" width="100" height="70" rx="10" fill="#d8dee7"/><path d="M995 270v45M970 292l25-25 25 25" fill="none" stroke="#243142" stroke-width="7" stroke-linecap="round"/><text x="995" y="380" text-anchor="middle" fill="#9fb0c5" font-size="17">Remove cleanly</text><path d="M335 295h125M730 295h125" stroke="#9ee66b" stroke-width="7"/><text x="70" y="510" fill="#f8fafc" font-size="22" font-weight="700">Then, with the Pi powered OFF:</text><text x="70" y="548" fill="#c8d5e4" font-size="20">Insert the verified microSD fully into the underside slot. Connect display and keyboard first. Connect USB-C power last.</text><text x="70" y="605" fill="#f3c768" font-size="18">Do not interrupt writing or verification, and never insert/remove the card while the Pi is powered.</text></g></svg>