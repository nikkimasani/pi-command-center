<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#07101a"/><rect x="30" y="30" width="1140" height="615" rx="28" fill="#0d1824" stroke="#31445c" stroke-width="3"/><text x="70" y="92" fill="#c4b5fd" font-family="Arial" font-size="28" font-weight="700">MagicMirror² • Official install and first launch</text><rect x="70" y="135" width="760" height="430" rx="22" fill="#05090e" stroke="#526981" stroke-width="3"/><circle cx="110" cy="172" r="8" fill="#ef4444"/><circle cx="138" cy="172" r="8" fill="#f59e0b"/><circle cx="166" cy="172" r="8" fill="#22c55e"/><g fill="#9ae6c2" font-family="monospace" font-size="19"><text x="105" y="235">$ node --version</text><text x="105" y="280">$ cd ~</text><text x="105" y="325">$ git clone https://github.com/MagicMirrorOrg/MagicMirror.git</text><text x="105" y="370">$ cd ~/MagicMirror &amp;&amp; node --run install-mm</text><text x="105" y="415">$ cp config/config.js.sample config/config.js</text><text x="105" y="460">$ node --run start</text></g><rect x="875" y="150" width="245" height="330" rx="22" fill="#090909" stroke="#66768b" stroke-width="3"/><text x="997" y="235" text-anchor="middle" fill="white" font-family="Arial" font-size="38" font-weight="700">10:42</text><text x="997" y="282" text-anchor="middle" fill="#dbe4ee" font-family="Arial" font-size="18">Friday</text><text x="997" y="335" text-anchor="middle" fill="#dbe4ee" font-family="Arial" font-size="18">72°</text><text x="997" y="410" text-anchor="middle" fill="#84d4ff" font-family="Arial" font-size="17">Default config first</text><text x="70" y="610" fill="#d9e4ef" font-family="Arial" font-size="20">Do not add third-party modules until the stock MagicMirror² window launches reliably and survives a reboot.</text></svg>