<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Raspberry Pi 5 board orientation and major ports"><style>text{font-family:Inter,Arial,sans-serif}.t{fill:#eaf2ff;font-weight:700}.s{fill:#a9bad0}.line{stroke:#8fa4bc;stroke-width:3}</style><rect width="1100" height="650" rx="30" fill="#08111a"/><text x="45" y="55" class="t" font-size="30">Raspberry Pi 5 • orientation and major connectors</text><text x="45" y="88" class="s" font-size="18">Use printed labels on your actual board as the final authority.</text><rect x="235" y="145" width="625" height="390" rx="26" fill="#17824e" stroke="#7dd3a7" stroke-width="5"/><rect x="330" y="240" width="150" height="150" rx="14" fill="#243449"/><text x="405" y="315" text-anchor="middle" class="t" font-size="23">BCM2712</text><rect x="555" y="215" width="130" height="90" rx="12" fill="#233043"/><text x="620" y="268" text-anchor="middle" class="s" font-size="16">RP1</text><rect x="285" y="160" width="520" height="42" rx="5" fill="#d9b84b"/><text x="545" y="188" text-anchor="middle" fill="#111" font-size="16" font-weight="700">40-pin GPIO header</text><rect x="180" y="220" width="60" height="90" rx="8" fill="#cfd8e3"/><rect x="180" y="350" width="60" height="90" rx="8" fill="#cfd8e3"/><rect x="860" y="205" width="75" height="60" rx="8" fill="#b7c6d8"/><rect x="860" y="300" width="75" height="60" rx="8" fill="#b7c6d8"/><rect x="860" y="395" width="75" height="60" rx="8" fill="#b7c6d8"/><rect x="420" y="535" width="70" height="45" rx="8" fill="#c4cedb"/><rect x="515" y="535" width="70" height="45" rx="8" fill="#c4cedb"/><rect x="650" y="535" width="75" height="45" rx="8" fill="#c4cedb"/><rect x="750" y="535" width="75" height="45" rx="8" fill="#c4cedb"/><path class="line" d="M210 220 100 165"/><text x="45" y="155" class="t" font-size="20">USB-C power</text><text x="45" y="180" class="s" font-size="16">Connect power last</text><path class="line" d="M210 395 95 445"/><text x="45" y="470" class="t" font-size="20">Ethernet</text><path class="line" d="M895 235 1010 180"/><text x="980" y="150" class="t" text-anchor="middle" font-size="20">USB ports</text><path class="line" d="M895 425 1015 485"/><text x="990" y="515" class="t" text-anchor="middle" font-size="20">USB ports</text><path class="line" d="M455 560 390 620"/><text x="330" y="625" class="t" text-anchor="middle" font-size="18">micro-HDMI</text><path class="line" d="M550 560 590 620"/><text x="635" y="625" class="t" text-anchor="middle" font-size="18">micro-HDMI</text><path class="line" d="M690 560 760 610"/><text x="820" y="625" class="t" text-anchor="middle" font-size="18">MIPI display/camera</text><text x="250" y="520" class="s" font-size="16">microSD slot is on the underside of the board.</text></svg>