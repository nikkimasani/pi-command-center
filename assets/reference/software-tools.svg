<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#07101a"/><rect x="30" y="30" width="1140" height="615" rx="28" fill="#0d1824" stroke="#31445c" stroke-width="3"/><text x="70" y="92" fill="#9ee66b" font-family="Arial" font-size="28" font-weight="700">Raspberry Pi OS • Update and install common tools</text><rect x="85" y="145" width="700" height="395" rx="22" fill="#05090e" stroke="#526981" stroke-width="3"/><circle cx="120" cy="180" r="8" fill="#ef4444"/><circle cx="148" cy="180" r="8" fill="#f59e0b"/><circle cx="176" cy="180" r="8" fill="#22c55e"/><g fill="#7ce3b2" font-family="monospace" font-size="20"><text x="120" y="245">$ sudo apt update</text><text x="120" y="295">$ sudo apt full-upgrade -y</text><text x="120" y="345">$ sudo apt install -y git curl python3 ... chromium</text><text x="120" y="395">$ mkdir -p ~/pi-projects</text><text x="120" y="445">$ git --version &amp;&amp; python3 --version</text></g><g font-family="Arial"><rect x="845" y="150" width="275" height="74" rx="15" fill="#102638"/><text x="880" y="195" fill="#f8fafc" font-size="22" font-weight="700">✓ Git</text><rect x="845" y="242" width="275" height="74" rx="15" fill="#102638"/><text x="880" y="287" fill="#f8fafc" font-size="22" font-weight="700">✓ Python 3</text><rect x="845" y="334" width="275" height="74" rx="15" fill="#102638"/><text x="880" y="379" fill="#f8fafc" font-size="22" font-weight="700">✓ Chromium</text><rect x="845" y="426" width="275" height="74" rx="15" fill="#102638"/><text x="880" y="471" fill="#f8fafc" font-size="22" font-weight="700">✓ ~/pi-projects</text><text x="75" y="605" fill="#d9e4ef" font-size="20">Run commands in order. Fix Wi-Fi or package errors before continuing to project-specific software.</text></g></svg>