<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="t d"><title id="t">Prepare the microSD card</title><desc id="d">Raspberry Pi Imager and 128 GB microSD preparation guide.</desc><rect width="1122" height="1402" rx="36" fill="#07101b"/><text x="72" y="104" fill="#65d482" font-family="Inter,Arial" font-size="30" font-weight="700">SHARED RASPBERRY PI SETUP · STEP 1</text><text x="72" y="170" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="800">Prepare the 128 GB microSD</text><text x="72" y="215" fill="#9fb0c6" font-family="Inter,Arial" font-size="23">Flash Raspberry Pi OS Desktop with Raspberry Pi Imager.</text><rect x="72" y="278" width="978" height="470" rx="28" fill="#0d1927" stroke="#243a52" stroke-width="3"/><rect x="120" y="350" width="520" height="300" rx="20" fill="#162538" stroke="#46617d" stroke-width="3"/><rect x="146" y="378" width="468" height="236" rx="10" fill="#09131f"/><circle cx="172" cy="400" r="7" fill="#ef476f"/><circle cx="196" cy="400" r="7" fill="#ffd166"/><circle cx="220" cy="400" r="7" fill="#65d482"/><text x="180" y="472" fill="#fff" font-family="Inter,Arial" font-size="28" font-weight="700">Raspberry Pi Imager</text><text x="180" y="522" fill="#9fb0c6" font-family="Inter,Arial" font-size="20">Device   Raspberry Pi 5</text><text x="180" y="562" fill="#9fb0c6" font-family="Inter,Arial" font-size="20">OS       Raspberry Pi OS (64-bit)</text><text x="180" y="602" fill="#65d482" font-family="Inter,Arial" font-size="20">Storage  128 GB SanDisk microSD</text><path d="M105 660h550l-45 40H150z" fill="#22344a"/><rect x="735" y="372" width="210" height="278" rx="22" fill="#e9edf2"/><rect x="770" y="405" width="140" height="186" rx="13" fill="#1b2430"/><text x="840" y="470" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="26" font-weight="800">128 GB</text><text x="840" y="510" text-anchor="middle" fill="#e63973" font-family="Inter,Arial" font-size="20" font-weight="700">microSD</text><path d="M770 405l40-32h100v32" fill="#1b2430"/><circle cx="840" cy="618" r="13" fill="#65d482"/><text x="72" y="820" fill="#fff" font-family="Inter,Arial" font-size="30" font-weight="800">Do this</text><g font-family="Inter,Arial" font-size="23"><circle cx="94" cy="882" r="18" fill="#65d482"/><text x="94" y="890" text-anchor="middle" fill="#07101b" font-weight="800">1</text><text x="132" y="891" fill="#dbe6f3">Insert the 128 GB microSD card into your computer.</text><circle cx="94" cy="950" r="18" fill="#65d482"/><text x="94" y="958" text-anchor="middle" fill="#07101b" font-weight="800">2</text><text x="132" y="959" fill="#dbe6f3">Open Raspberry Pi Imager and select Raspberry Pi 5.</text><circle cx="94" cy="1018" r="18" fill="#65d482"/><text x="94" y="1026" text-anchor="middle" fill="#07101b" font-weight="800">3</text><text x="132" y="1027" fill="#dbe6f3">Choose Raspberry Pi OS 64-bit Desktop.</text><circle cx="94" cy="1086" r="18" fill="#65d482"/><text x="94" y="1094" text-anchor="middle" fill="#07101b" font-weight="800">4</text><text x="132" y="1095" fill="#dbe6f3">Select the 128 GB card as storage.</text></g><rect x="72" y="1160" width="978" height="154" rx="24" fill="#0c2a22" stroke="#2a805d" stroke-width="2"/><text x="106" y="1212" fill="#65d482" font-family="Inter,Arial" font-size="22" font-weight="800">CONTINUE ONLY WHEN</text><text x="106" y="1260" fill="#e5fff2" font-family="Inter,Arial" font-size="23">The correct OS and the 128 GB card are selected.</text><text x="106" y="1294" fill="#9fd9bd" font-family="Inter,Arial" font-size="19">Configure SSH, Wi‑Fi and locale before pressing Write.</text></svg>