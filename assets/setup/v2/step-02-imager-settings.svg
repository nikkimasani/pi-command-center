<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="t d"><title id="t">Configure Raspberry Pi Imager</title><desc id="d">Enable SSH, Wi-Fi, hostname, username and America Chicago timezone.</desc><rect width="1122" height="1402" rx="36" fill="#07101b"/><text x="72" y="104" fill="#65d482" font-family="Inter,Arial" font-size="30" font-weight="700">SHARED RASPBERRY PI SETUP · STEP 2</text><text x="72" y="170" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="800">Configure Imager settings</text><text x="72" y="215" fill="#9fb0c6" font-family="Inter,Arial" font-size="23">Set connectivity and login options before writing the card.</text><rect x="106" y="274" width="910" height="770" rx="28" fill="#eef2f6"/><rect x="106" y="274" width="910" height="72" rx="28" fill="#d7dde5"/><circle cx="146" cy="310" r="9" fill="#ef476f"/><circle cx="178" cy="310" r="9" fill="#ffd166"/><circle cx="210" cy="310" r="9" fill="#65d482"/><text x="561" y="321" text-anchor="middle" fill="#17202b" font-family="Inter,Arial" font-size="24" font-weight="800">OS Customisation</text><g font-family="Inter,Arial"><text x="160" y="400" fill="#263648" font-size="21" font-weight="700">Hostname</text><rect x="160" y="420" width="802" height="54" rx="10" fill="#fff" stroke="#bac5d1"/><text x="184" y="455" fill="#182431" font-size="22">nikkipi</text><text x="160" y="520" fill="#263648" font-size="21" font-weight="700">Username &amp; password</text><rect x="160" y="540" width="382" height="54" rx="10" fill="#fff" stroke="#bac5d1"/><text x="184" y="575" fill="#182431" font-size="20">your username</text><rect x="580" y="540" width="382" height="54" rx="10" fill="#fff" stroke="#bac5d1"/><text x="604" y="575" fill="#6e7b8b" font-size="20">••••••••••••</text><text x="160" y="640" fill="#263648" font-size="21" font-weight="700">Wi‑Fi</text><rect x="160" y="660" width="382" height="54" rx="10" fill="#fff" stroke="#bac5d1"/><text x="184" y="695" fill="#182431" font-size="20">Your Wi‑Fi SSID</text><rect x="580" y="660" width="382" height="54" rx="10" fill="#fff" stroke="#bac5d1"/><text x="604" y="695" fill="#6e7b8b" font-size="20">••••••••••••</text><rect x="160" y="758" width="30" height="30" rx="6" fill="#65d482"/><path d="M168 773l7 7 13-15" fill="none" stroke="#07101b" stroke-width="4"/><text x="208" y="781" fill="#263648" font-size="21" font-weight="700">Enable SSH</text><text x="208" y="815" fill="#58697b" font-size="18">Use password authentication</text><text x="160" y="866" fill="#263648" font-size="21" font-weight="700">Locale &amp; timezone</text><rect x="160" y="888" width="382" height="54" rx="10" fill="#fff" stroke="#bac5d1"/><text x="184" y="923" fill="#182431" font-size="20">America/Chicago</text><rect x="580" y="888" width="382" height="54" rx="10" fill="#fff" stroke="#bac5d1"/><text x="604" y="923" fill="#182431" font-size="20">US keyboard</text><rect x="746" y="972" width="216" height="50" rx="12" fill="#65d482"/><text x="854" y="1005" text-anchor="middle" fill="#07101b" font-size="21" font-weight="800">SAVE</text></g><rect x="72" y="1100" width="978" height="210" rx="24" fill="#0c2a22" stroke="#2a805d" stroke-width="2"/><text x="106" y="1150" fill="#65d482" font-family="Inter,Arial" font-size="22" font-weight="800">VERIFY BEFORE WRITE</text><text x="106" y="1196" fill="#e5fff2" font-family="Inter,Arial" font-size="22">✓ Hostname: nikkipi</text><text x="106" y="1234" fill="#e5fff2" font-family="Inter,Arial" font-size="22">✓ SSH enabled  ✓ Wi‑Fi saved  ✓ America/Chicago</text><text x="106" y="1274" fill="#9fd9bd" font-family="Inter,Arial" font-size="19">Then save the settings and write the microSD card.</text></svg>