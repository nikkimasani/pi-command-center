<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="t d"><title id="t">Install Raspberry Pi 5 in the metal case</title><desc id="d">Exploded view showing Pi 5, case base, standoffs and port alignment.</desc><rect width="1122" height="1402" rx="36" fill="#07101b"/><text x="72" y="104" fill="#65d482" font-family="Inter,Arial" font-size="30" font-weight="700">SHARED RASPBERRY PI SETUP · STEP 3</text><text x="72" y="170" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="800">Install the Pi 5 in the metal case</text><text x="72" y="215" fill="#9fb0c6" font-family="Inter,Arial" font-size="23">Secure the board without blocking ports, airflow or the DSI area.</text><rect x="72" y="278" width="978" height="640" rx="28" fill="#0d1927" stroke="#243a52" stroke-width="3"/><text x="112" y="330" fill="#cbd8e6" font-family="Inter,Arial" font-size="21" font-weight="700">EXPLODED ASSEMBLY</text><rect x="260" y="690" width="600" height="140" rx="28" fill="#4c5663" stroke="#8998aa" stroke-width="4"/><rect x="305" y="650" width="510" height="70" rx="18" fill="#303a46"/><circle cx="330" cy="674" r="11" fill="#d9e1e9"/><circle cx="790" cy="674" r="11" fill="#d9e1e9"/><line x1="330" y1="674" x2="330" y2="560" stroke="#65d482" stroke-width="5" stroke-dasharray="12 10"/><line x1="790" y1="674" x2="790" y2="560" stroke="#65d482" stroke-width="5" stroke-dasharray="12 10"/><rect x="250" y="420" width="620" height="160" rx="18" fill="#2d9c6b" stroke="#7ce2ad" stroke-width="4"/><rect x="286" y="455" width="130" height="72" rx="9" fill="#263645"/><rect x="462" y="447" width="112" height="86" rx="8" fill="#1a252f"/><rect x="620" y="452" width="180" height="34" rx="5" fill="#c3cbd5"/><rect x="620" y="498" width="180" height="34" rx="5" fill="#c3cbd5"/><text x="560" y="390" text-anchor="middle" fill="#65d482" font-family="Inter,Arial" font-size="24" font-weight="800">RASPBERRY PI 5</text><path d="M210 470h-64v70h64" fill="none" stroke="#55a6ff" stroke-width="5"/><text x="132" y="450" fill="#9ccaff" font-family="Inter,Arial" font-size="18">USB-C / HDMI</text><path d="M906 460h70" stroke="#55a6ff" stroke-width="5"/><text x="887" y="440" fill="#9ccaff" font-family="Inter,Arial" font-size="18">USB / Ethernet</text><path d="M560 585v72" stroke="#ffd166" stroke-width="5"/><text x="590" y="628" fill="#ffe6a0" font-family="Inter,Arial" font-size="18">Keep DSI area accessible</text><g font-family="Inter,Arial" font-size="23"><text x="72" y="986" fill="#fff" font-size="30" font-weight="800">Assembly checks</text><circle cx="94" cy="1044" r="18" fill="#65d482"/><text x="94" y="1052" text-anchor="middle" fill="#07101b" font-weight="800">1</text><text x="132" y="1053" fill="#dbe6f3">Align the board with the standoffs. Never force it.</text><circle cx="94" cy="1112" r="18" fill="#65d482"/><text x="94" y="1120" text-anchor="middle" fill="#07101b" font-weight="800">2</text><text x="132" y="1121" fill="#dbe6f3">Tighten screws evenly until snug, not overtight.</text><circle cx="94" cy="1180" r="18" fill="#65d482"/><text x="94" y="1188" text-anchor="middle" fill="#07101b" font-weight="800">3</text><text x="132" y="1189" fill="#dbe6f3">Confirm USB-C, HDMI, USB, Ethernet and DSI access.</text></g><rect x="72" y="1240" width="978" height="92" rx="24" fill="#0c2a22" stroke="#2a805d" stroke-width="2"/><text x="106" y="1297" fill="#e5fff2" font-family="Inter,Arial" font-size="22">Ready when the board is secure and every required port remains reachable.</text></svg>