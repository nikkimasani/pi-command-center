<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="t d"><title id="t">First boot and update</title><desc id="d">Boot Raspberry Pi OS, confirm Wi-Fi and run update commands.</desc><rect width="1122" height="1402" rx="36" fill="#07101b"/><text x="72" y="104" fill="#65d482" font-family="Inter,Arial" font-size="30" font-weight="700">SHARED RASPBERRY PI SETUP · STEP 4</text><text x="72" y="170" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="800">First boot and update</text><text x="72" y="215" fill="#9fb0c6" font-family="Inter,Arial" font-size="23">Confirm Raspberry Pi OS, Wi‑Fi and system updates before hardware work.</text><rect x="72" y="278" width="978" height="500" rx="28" fill="#0d1927" stroke="#243a52" stroke-width="3"/><rect x="125" y="330" width="872" height="390" rx="22" fill="#1a2634"/><rect x="148" y="352" width="826" height="344" rx="12" fill="#d9e9ef"/><rect x="148" y="352" width="826" height="48" rx="12" fill="#27394a"/><text x="176" y="384" fill="#fff" font-family="Inter,Arial" font-size="18" font-weight="700">Raspberry Pi OS</text><circle cx="932" cy="376" r="8" fill="#65d482"/><text x="905" y="382" text-anchor="end" fill="#d6e6f3" font-family="Inter,Arial" font-size="16">Wi‑Fi</text><rect x="205" y="445" width="712" height="205" rx="15" fill="#07101b"/><text x="236" y="486" fill="#9fb0c6" font-family="ui-monospace,monospace" font-size="19">pi@nikkipi:~ $</text><text x="236" y="527" fill="#65d482" font-family="ui-monospace,monospace" font-size="21">sudo apt update</text><text x="236" y="570" fill="#65d482" font-family="ui-monospace,monospace" font-size="21">sudo apt upgrade -y</text><text x="236" y="613" fill="#65d482" font-family="ui-monospace,monospace" font-size="21">sudo reboot</text><text x="72" y="854" fill="#fff" font-family="Inter,Arial" font-size="30" font-weight="800">Boot checklist</text><g font-family="Inter,Arial" font-size="23"><circle cx="94" cy="914" r="18" fill="#65d482"/><text x="94" y="922" text-anchor="middle" fill="#07101b" font-weight="800">1</text><text x="132" y="923" fill="#dbe6f3">Insert the flashed microSD card.</text><circle cx="94" cy="982" r="18" fill="#65d482"/><text x="94" y="990" text-anchor="middle" fill="#07101b" font-weight="800">2</text><text x="132" y="991" fill="#dbe6f3">Connect display, keyboard and USB‑C power.</text><circle cx="94" cy="1050" r="18" fill="#65d482"/><text x="94" y="1058" text-anchor="middle" fill="#07101b" font-weight="800">3</text><text x="132" y="1059" fill="#dbe6f3">Confirm the desktop loads and Wi‑Fi connects.</text><circle cx="94" cy="1118" r="18" fill="#65d482"/><text x="94" y="1126" text-anchor="middle" fill="#07101b" font-weight="800">4</text><text x="132" y="1127" fill="#dbe6f3">Run update, upgrade and reboot from Terminal.</text></g><rect x="72" y="1190" width="978" height="142" rx="24" fill="#0c2a22" stroke="#2a805d" stroke-width="2"/><text x="106" y="1240" fill="#65d482" font-family="Inter,Arial" font-size="22" font-weight="800">EXPECTED RESULT</text><text x="106" y="1284" fill="#e5fff2" font-family="Inter,Arial" font-size="22">Desktop loads normally, Wi‑Fi is connected, and updates finish without errors.</text></svg>