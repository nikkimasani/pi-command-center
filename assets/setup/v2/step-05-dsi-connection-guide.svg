<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="t d"><title id="t">Connect the DSI cable safely</title><desc id="d">Power off, disconnect USB-C, unlock the DSI connector, align, insert and lock the ribbon cable.</desc><rect width="1122" height="1402" rx="36" fill="#07101b"/><text x="72" y="104" fill="#65d482" font-family="Inter,Arial" font-size="30" font-weight="700">SHARED RASPBERRY PI SETUP · STEP 5</text><text x="72" y="170" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="800">Connect the DSI cable safely</text><text x="72" y="215" fill="#9fb0c6" font-family="Inter,Arial" font-size="23">Power must be fully disconnected before touching the ribbon connector.</text><rect x="72" y="278" width="978" height="170" rx="24" fill="#32141a" stroke="#a8404f" stroke-width="3"/><text x="108" y="334" fill="#ff8fa1" font-family="Inter,Arial" font-size="25" font-weight="800">POWER OFF FIRST</text><text x="108" y="382" fill="#ffe5e9" font-family="Inter,Arial" font-size="23">Shut down Raspberry Pi OS, then unplug USB‑C power.</text><text x="108" y="417" fill="#d9a8af" font-family="Inter,Arial" font-size="18">Never insert or remove the DSI ribbon while the Pi is powered.</text><g font-family="Inter,Arial"><rect x="72" y="500" width="225" height="430" rx="24" fill="#0d1927" stroke="#243a52" stroke-width="3"/><circle cx="112" cy="546" r="20" fill="#65d482"/><text x="112" y="554" text-anchor="middle" fill="#07101b" font-size="22" font-weight="800">1</text><text x="150" y="554" fill="#fff" font-size="23" font-weight="800">UNLOCK</text><rect x="112" y="640" width="145" height="60" rx="8" fill="#d6dde5"/><rect x="122" y="620" width="125" height="24" rx="5" fill="#55616e"/><path d="M184 600v-52" stroke="#65d482" stroke-width="5"/><path d="M168 565l16-18 16 18" fill="none" stroke="#65d482" stroke-width="5"/><text x="112" y="770" fill="#9fb0c6" font-size="18">Lift the small</text><text x="112" y="798" fill="#9fb0c6" font-size="18">connector latch.</text><rect x="323" y="500" width="225" height="430" rx="24" fill="#0d1927" stroke="#243a52" stroke-width="3"/><circle cx="363" cy="546" r="20" fill="#65d482"/><text x="363" y="554" text-anchor="middle" fill="#07101b" font-size="22" font-weight="800">2</text><text x="401" y="554" fill="#fff" font-size="23" font-weight="800">ALIGN</text><rect x="388" y="604" width="95" height="210" rx="10" fill="#eaecef"/><rect x="403" y="604" width="65" height="32" fill="#c99a39"/><path d="M435 570v-50" stroke="#55a6ff" stroke-width="5"/><path d="M419 536l16-18 16 18" fill="none" stroke="#55a6ff" stroke-width="5"/><text x="363" y="858" fill="#9fb0c6" font-size="18">Keep the ribbon</text><text x="363" y="886" fill="#9fb0c6" font-size="18">straight and centered.</text><rect x="574" y="500" width="225" height="430" rx="24" fill="#0d1927" stroke="#243a52" stroke-width="3"/><circle cx="614" cy="546" r="20" fill="#65d482"/><text x="614" y="554" text-anchor="middle" fill="#07101b" font-size="22" font-weight="800">3</text><text x="652" y="554" fill="#fff" font-size="23" font-weight="800">INSERT</text><rect x="642" y="654" width="95" height="80" rx="8" fill="#d6dde5"/><rect x="657" y="560" width="65" height="120" rx="8" fill="#eaecef"/><path d="M690 578v80" stroke="#65d482" stroke-width="5"/><path d="M674 642l16 18 16-18" fill="none" stroke="#65d482" stroke-width="5"/><text x="614" y="818" fill="#9fb0c6" font-size="18">Slide the ribbon</text><text x="614" y="846" fill="#9fb0c6" font-size="18">fully into the socket.</text><rect x="825" y="500" width="225" height="430" rx="24" fill="#0d1927" stroke="#243a52" stroke-width="3"/><circle cx="865" cy="546" r="20" fill="#65d482"/><text x="865" y="554" text-anchor="middle" fill="#07101b" font-size="22" font-weight="800">4</text><text x="903" y="554" fill="#fff" font-size="23" font-weight="800">LOCK</text><rect x="890" y="640" width="125" height="60" rx="8" fill="#d6dde5"/><rect x="900" y="620" width="105" height="24" rx="5" fill="#55616e"/><path d="M952 552v54" stroke="#65d482" stroke-width="5"/><path d="M936 590l16 18 16-18" fill="none" stroke="#65d482" stroke-width="5"/><text x="865" y="770" fill="#9fb0c6" font-size="18">Press the latch</text><text x="865" y="798" fill="#9fb0c6" font-size="18">down evenly.</text></g><rect x="72" y="988" width="978" height="322" rx="24" fill="#0c2a22" stroke="#2a805d" stroke-width="2"/><text x="106" y="1042" fill="#65d482" font-family="Inter,Arial" font-size="22" font-weight="800">FINAL CHECK BEFORE POWER</text><g fill="#e5fff2" font-family="Inter,Arial" font-size="22"><text x="106" y="1092">✓ Ribbon is straight and fully seated</text><text x="106" y="1138">✓ Connector latch is closed evenly</text><text x="106" y="1184">✓ Cable is not pinched, twisted or under tension</text><text x="106" y="1230">✓ Orientation matches the board connector</text></g><text x="106" y="1278" fill="#9fd9bd" font-family="Inter,Arial" font-size="19">Only restore USB‑C power after all four checks pass.</text></svg>