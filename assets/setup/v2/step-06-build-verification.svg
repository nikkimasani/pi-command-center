<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="t d"><title id="t">Verify the Raspberry Pi build</title><desc id="d">Checklist for display, touch, Wi-Fi, SSH and temperature.</desc><rect width="1122" height="1402" rx="36" fill="#07101b"/><text x="72" y="104" fill="#65d482" font-family="Inter,Arial" font-size="30" font-weight="700">SHARED RASPBERRY PI SETUP · STEP 6</text><text x="72" y="170" fill="#fff" font-family="Inter,Arial" font-size="52" font-weight="800">Verify the complete setup</text><text x="72" y="215" fill="#9fb0c6" font-family="Inter,Arial" font-size="23">Run every shared-system check before starting a project-specific build.</text><rect x="72" y="282" width="978" height="860" rx="28" fill="#0d1927" stroke="#243a52" stroke-width="3"/><g font-family="Inter,Arial"><text x="118" y="348" fill="#fff" font-size="28" font-weight="800">FINAL SYSTEM CHECKLIST</text><g transform="translate(118 398)"><rect width="886" height="112" rx="18" fill="#10271f" stroke="#2a805d"/><circle cx="55" cy="56" r="27" fill="#65d482"/><path d="M42 56l9 10 19-24" fill="none" stroke="#07101b" stroke-width="7" stroke-linecap="round"/><text x="104" y="48" fill="#fff" font-size="24" font-weight="800">Display</text><text x="104" y="78" fill="#a9c5b8" font-size="19">Raspberry Pi OS appears at the correct resolution.</text></g><g transform="translate(118 530)"><rect width="886" height="112" rx="18" fill="#10271f" stroke="#2a805d"/><circle cx="55" cy="56" r="27" fill="#65d482"/><path d="M42 56l9 10 19-24" fill="none" stroke="#07101b" stroke-width="7" stroke-linecap="round"/><text x="104" y="48" fill="#fff" font-size="24" font-weight="800">Touch</text><text x="104" y="78" fill="#a9c5b8" font-size="19">Tap, swipe and pointer alignment all respond correctly.</text></g><g transform="translate(118 662)"><rect width="886" height="112" rx="18" fill="#10271f" stroke="#2a805d"/><circle cx="55" cy="56" r="27" fill="#65d482"/><path d="M42 56l9 10 19-24" fill="none" stroke="#07101b" stroke-width="7" stroke-linecap="round"/><text x="104" y="48" fill="#fff" font-size="24" font-weight="800">Wi‑Fi</text><text x="104" y="78" fill="#a9c5b8" font-size="19">The Pi reconnects automatically after reboot.</text></g><g transform="translate(118 794)"><rect width="886" height="112" rx="18" fill="#10271f" stroke="#2a805d"/><circle cx="55" cy="56" r="27" fill="#65d482"/><path d="M42 56l9 10 19-24" fill="none" stroke="#07101b" stroke-width="7" stroke-linecap="round"/><text x="104" y="48" fill="#fff" font-size="24" font-weight="800">SSH</text><text x="104" y="78" fill="#a9c5b8" font-size="19">Another device can reach nikkipi and log in successfully.</text></g><g transform="translate(118 926)"><rect width="886" height="112" rx="18" fill="#10271f" stroke="#2a805d"/><circle cx="55" cy="56" r="27" fill="#65d482"/><path d="M42 56l9 10 19-24" fill="none" stroke="#07101b" stroke-width="7" stroke-linecap="round"/><text x="104" y="48" fill="#fff" font-size="24" font-weight="800">Temperature</text><text x="104" y="78" fill="#a9c5b8" font-size="19">Case airflow is clear and the Pi is not overheating.</text></g></g><rect x="72" y="1194" width="978" height="138" rx="24" fill="#10243b" stroke="#3c76af" stroke-width="2"/><text x="106" y="1242" fill="#8ec7ff" font-family="Inter,Arial" font-size="22" font-weight="800">READY FOR PROJECT-SPECIFIC STEPS</text><text x="106" y="1287" fill="#e9f5ff" font-family="Inter,Arial" font-size="22">Continue only after all five checks pass consistently.</text></svg>