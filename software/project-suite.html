<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Project Suite</title><style>:root{color-scheme:dark;font-family:Inter,system-ui;background:#05080d;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05080d}.screen{min-height:100vh;padding:24px}.center{display:grid;place-items:center}.wrap{width:min(1050px,100%);margin:auto}.muted{color:#9fb0c5}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#0d1520;border:1px solid #27364a;border-radius:18px;padding:20px}button,a.btn,label.btn{font:inherit;border:1px solid #475569;background:#111827;color:#fff;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:700;display:inline-block}.clock{font-size:clamp(4rem,18vw,9rem);font-weight:800;line-height:1}.timer{font-size:clamp(5rem,24vw,11rem);font-weight:800;text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sleep{position:fixed;inset:0;background:#000;cursor:none}.photo img{width:100%;height:100vh;object-fit:contain;background:#000}.controls{position:fixed;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;gap:8px;opacity:.2}.controls:hover,.controls:focus-within{opacity:1}input[type=file]{display:none}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main id="app"></main><script>const q=new URLSearchParams(location.search),mode=q.get('app')||'dashboard',app=document.getElementById('app');const nav='<p class="muted"><a class="btn" href="/">Pi Command Center</a></p>';function dashboard(){app.innerHTML='<section class="screen center"><div class="wrap">'+nav+'<div class="muted">PI PERSONAL DASHBOARD</div><div class="clock" id="clock">--:--</div><div id="date" class="muted"></div><div class="cards" style="margin-top:24px"><div class="card"><b>Top 3 today</b><ol contenteditable="true"><li>Tap to edit</li><li>Tap to edit</li><li>Tap to edit</li></ol></div><div class="card"><b>Quick note</b><p contenteditable="true">Tap to edit this note.</p></div><div class="card"><b>System</b><p id="network"></p><p class="muted">Local starter app, no API required.</p></div></div></div></section>';tick()}function desk(){app.innerHTML='<section class="screen center"><div class="wrap">'+nav+'<div class="clock" id="clock">--:--</div><div id="date" class="muted"></div><div class="cards" style="margin-top:26px"><div class="card"><b>Network</b><p id="network"></p></div><div class="card"><b>Local server</b><p>127.0.0.1:8088</p></div><div class="card"><b>Display</b><p id="display"></p></div></div></div></section>';tick();display.textContent=innerWidth+' × '+innerHeight}function pomodoro(){let focus=true,left=1500,timer=null;app.innerHTML='<section class="screen center"><div><div class="muted" style="text-align:center" id="label">FOCUS</div><div class="timer" id="time">25:00</div><div class="row"><button id="start">Start</button><button id="reset">Reset</button><button id="switcher">Break</button></div><p class="muted" style="text-align:center">Space starts/pauses. R resets.</p></div></section>';const paint=()=>{time.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');label.textContent=focus?'FOCUS':'BREAK';switcher.textContent=focus?'Break':'Focus'};const stop=()=>{clearInterval(timer);timer=null;start.textContent='Start'};const toggle=()=>{if(timer){stop();return}start.textContent='Pause';timer=setInterval(()=>{if(left>0){left--;paint()}else{stop();focus=!focus;left=(focus?25:5)*60;paint()}},1000)};start.onclick=toggle;reset.onclick=()=>{stop();left=(focus?25:5)*60;paint()};switcher.onclick=()=>{stop();focus=!focus;left=(focus?25:5)*60;paint()};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='r')reset.click()});paint()}function cyberdeck(){app.innerHTML='<section class="screen"><div class="wrap">'+nav+'<h1>CYBERDECK</h1><p class="muted">Local launcher for the tools you intentionally install.</p><div class="cards"><a class="card" href="/"><b>Raspberry Pi Reference</b><p class="muted">Ports, GPIO, OS, Terminal</p></a><a class="card" href="?app=desk"><b>Desk Info</b><p class="muted">Clock and status</p></a><a class="card" href="?app=ai"><b>AI Terminal</b><p class="muted">Safe AI launch page</p></a></div></div></section>'}function ai(){app.innerHTML='<section class="screen center"><div class="wrap">'+nav+'<div class="card"><h1>AI Terminal launcher</h1><p>This page intentionally does not ask for or store an API key. Use your normal AI web app, or add a server-side API bridge later.</p><p><a class="btn" href="https://chatgpt.com">Open ChatGPT</a></p><textarea style="width:100%;min-height:180px;background:#020617;color:#fff;border:1px solid #334155;border-radius:12px;padding:14px" placeholder="Local scratchpad. Nothing is sent automatically."></textarea></div></div></section>'}function photo(){let urls=[],i=0,playing=true,timer;app.innerHTML='<section class="photo" id="stage"><div class="screen center muted">Choose photos to begin.</div></section><div class="controls"><label class="btn">Choose photos<input id="files" type="file" accept="image/*" multiple></label><button id="prev">Previous</button><button id="next">Next</button><button id="play">Pause</button></div>';const show=()=>{stage.innerHTML='';if(!urls.length){stage.innerHTML='<div class="screen center muted">Choose photos to begin.</div>';return}const img=new Image();img.src=urls[i];img.alt='Photo '+(i+1);stage.append(img)};const advance=n=>{if(urls.length){i=(i+n+urls.length)%urls.length;show()}};const schedule=()=>{clearInterval(timer);if(playing)timer=setInterval(()=>advance(1),10000)};files.onchange=e=>{urls.forEach(URL.revokeObjectURL);urls=[...e.target.files].map(URL.createObjectURL);i=0;show();schedule()};prev.onclick=()=>advance(-1);next.onclick=()=>advance(1);play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';schedule()};schedule()}function magic(){app.innerHTML='<section class="screen center" id="panel"><div class="card" style="width:min(620px,92vw)"><h1>Magic Frame controller</h1><p>Use this page to prove the dormant state before adding sensors. Dashboard mode is MagicMirror².</p><button id="sleepBtn" style="width:100%">Enter pure-black Sleep mode</button><a class="btn" style="width:100%;text-align:center;margin-top:10px" href="?app=photo">Open Photo mode</a><a class="btn" style="width:100%;text-align:center;margin-top:10px" href="http://127.0.0.1:8080">Open MagicMirror server mode</a></div></section><div class="sleep" id="sleep" hidden tabindex="0" aria-label="Sleeping. Tap to wake."></div>';sleepBtn.onclick=()=>{panel.hidden=true;sleep.hidden=false;sleep.focus()};const wake=()=>{sleep.hidden=true;panel.hidden=false};sleep.onclick=wake;sleep.onkeydown=wake}function tick(){const d=new Date();const c=document.getElementById('clock'),dt=document.getElementById('date'),n=document.getElementById('network');if(c)c.textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});if(dt)dt.textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});if(n)n.textContent=navigator.onLine?'Online':'Offline'}({dashboard,desk,pomodoro,cyberdeck,ai,photo,magic}[mode]||dashboard)();if(mode==='dashboard'||mode==='desk')setInterval(tick,1000);</script></body></html>
